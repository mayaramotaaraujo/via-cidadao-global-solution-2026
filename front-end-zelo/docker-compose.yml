# Sobe a aplicação completa:  docker compose up --build
# Front: http://localhost:8501   ·   API (docs): http://localhost:8000/docs
services:
  api:
    build: ./backend
    env_file: .env            # copie .env.example para .env e preencha
    environment:
      DB_PATH: /app/data/zelo.db
      ALLOWED_ORIGINS: http://localhost:8501
    ports:
      - "8000:8000"
    volumes:
      - zelo-dados:/app/data  # relatos persistem entre reinícios
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000   # nome do serviço na rede interna do compose
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  zelo-dados:
